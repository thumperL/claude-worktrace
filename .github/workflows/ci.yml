name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only — PRs from forks get no write access
permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Python 3.9 compatibility
        run: |
          python3 --version
          python3 tests/test_python39_compat.py

      - name: Transcript parser unit tests
        run: python3 tests/test_transcript_parser.py

      - name: Ledger hook unit tests
        run: python3 tests/test_ledger_hook.py

      - name: Safety classifier unit tests
        run: python3 tests/test_safety.py

      - name: Friction ledger unit tests
        run: python3 tests/test_ledger.py
